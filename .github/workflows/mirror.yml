name: Mirror AOM Repository

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: self-hosted
    steps:
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone or update source repository
        run: |
          if [ -d "source-repo" ]; then
            cd source-repo
            git fetch --all --prune
          else
            git clone --bare https://aomedia.googlesource.com/aom source-repo
            cd source-repo
            git fetch --all --prune
          fi

      - name: Set push remote
        run: |
          cd source-repo
          git remote remove target || true
          git remote add target https://${{ secrets.PAT_TOKEN }}@github.com/SoftCreatR/aom.git

      - name: Push to GitHub
        run: |
          cd source-repo
          # Erst alle Branches
          git push --all target
          # Dann alle Tags
          git push --tags target
